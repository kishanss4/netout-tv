plugins {
    id 'com.android.application'
}

android {
    namespace 'com.netout.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.netout.tv"
        minSdk 21
        targetSdk 34
        // CI sets GITHUB_RUN_NUMBER so every release has a higher versionCode
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "2")
        versionName "1.1"
    }

    signingConfigs {
        // Fixed key kept in the repo so new APKs install OVER old ones
        // (no more uninstalling first). Sideload-grade only, not for Play Store.
        netout {
            storeFile file("netout-release.jks")
            storePassword "netout123"
            keyAlias "netout"
            keyPassword "netout123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.netout
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
